name: Keep Supabase Alive

# Free-tier Supabase projects pause after 7 days of inactivity.
# This workflow pings the REST API twice a week so the project stays awake.

on:
  schedule:
    # 06:00 UTC every Monday and Thursday (max gap ~3-4 days, well under 7).
    - cron: "0 6 * * 1,4"
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/cabins?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "Supabase responded with HTTP $code"
          # Any HTTP response means the request reached the project and counts
          # as activity. Fail only if there was no response at all (network error
          # or missing secrets).
          if [ -z "$code" ] || [ "$code" = "000" ]; then
            echo "::error::No response from Supabase — check the SUPABASE_URL and SUPABASE_ANON_KEY secrets."
            exit 1
          fi
